<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading…</title>
<style>html,body{margin:0;height:100%;background:#111;color:#bbb;font-family:system-ui,sans-serif}
#msg{display:flex;height:100%;align-items:center;justify-content:center;text-align:center;padding:1rem}</style>
<script src="/scram/scramjet.all.js"></script>
<script src="/baremux/index.js"></script>
<script src="/register-sw.js"></script>
</head>
<body>
<div id="msg">Loading…</div>
<script>
// Usage: /go.html?url=example.com   or   /go.html?q=search words
(async () => {
  const msg = document.getElementById("msg");
  const p = new URLSearchParams(location.search);
  const input = (p.get("url") || p.get("q") || "").trim();
  if (p.get("retry") && sessionStorage.getItem("sjRetry") === input) { msg.textContent = "The engine could not start. Try Chrome on https."; return; }
  try { if (p.get("retry")) sessionStorage.setItem("sjRetry", input); } catch {}
  if (!input) { msg.textContent = "No URL given. Use /go.html?url=example.com"; return; }

  let url = null;
  const looksLikeUrl = /^(https?:\/\/)?[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}(:\d+)?([\/?#].*)?$/i;
  if (!/\s/.test(input) && looksLikeUrl.test(input)) {
    try { url = new URL(/^https?:\/\//i.test(input) ? input : "https://" + input).toString(); } catch {}
  }
  if (!url) url = "https://www.google.com/search?q=" + encodeURIComponent(input);

  const step = (t) => { msg.textContent = "Loading… (" + t + ")"; };
  const timeout = (pr, t) => Promise.race([pr, new Promise((_, r) => setTimeout(() => r(new Error("stuck at: " + t)), 15000))]);
  // Games don't run well through the proxy, so CrazyGames game pages load
  // CrazyGames' official embed directly instead.
  const gameEmbed = (u) => {
    try {
      const x = new URL(u);
      const m = x.pathname.match(/^\/game\/([a-z0-9-]+)/i);
      if (/(^|\.)crazygames\.com$/i.test(x.hostname) && m) return "https://www.crazygames.com/embed/" + m[1];
    } catch {}
    return null;
  };
  const showDirect = (src) => {
    document.querySelectorAll("iframe").forEach((f) => f.remove());
    const f = document.createElement("iframe");
    f.setAttribute("credentialless", "");
    f.setAttribute("allow", "fullscreen; autoplay; gamepad; clipboard-read; clipboard-write");
    f.allowFullscreen = true;
    f.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;background:#000";
    f.src = src;
    document.body.appendChild(f);
  };
  if (gameEmbed(url)) { showDirect(gameEmbed(url)); return; }

  try {
    step("starting engine");
    const { ScramjetController } = $scramjetLoadController();
    const sj = new ScramjetController({
      files: { wasm: "/scram/scramjet.wasm.wasm", all: "/scram/scramjet.all.js", sync: "/scram/scramjet.sync.js" },
    });
    await timeout(sj.init(), "engine init");
    step("background worker");
    await timeout(registerSW(), "registering worker");
    await timeout(navigator.serviceWorker.ready, "worker ready");
    step("connecting");
    const conn = new BareMux.BareMuxConnection("/baremux/worker.js");
    const wisp = (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/wisp/";
    if ((await timeout(conn.getTransport(), "checking transport")) !== "/epoxy/index.mjs") {
      await timeout(conn.setTransport("/epoxy/index.mjs", [{ wisp }]), "setting transport");
    }
    step("opening site");
    const frame = sj.createFrame();
    frame.frame.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff";
    frame.frame.setAttribute("allow", "fullscreen; clipboard-read; clipboard-write");
    document.body.appendChild(frame.frame);
    const onChange = (e) => { const g = gameEmbed(e.url); if (g) showDirect(g); };
    frame.addEventListener("navigate", onChange);
    frame.addEventListener("urlchange", onChange);
    frame.go(url);
    try { sessionStorage.removeItem("sjRetry"); } catch {}
  } catch (e) {
    msg.textContent = "Proxy failed to start: " + e;
  }
})();
</script>
</body>
</html>
