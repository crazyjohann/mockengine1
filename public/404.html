<!doctype html>
<html><head><meta charset="utf-8"><title>Loading…</title>
<style>html,body{margin:0;height:100%;background:#111;color:#bbb;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:1rem}</style>
</head><body><div id="msg">Loading…</div>
<script>
// If a proxied page loaded before the engine was ready, restart it through go.html.
(function () {
  var msg = document.getElementById("msg");
  var prefix = "/scramjet/";
  var path = location.pathname;
  if (path.indexOf(prefix) === 0 && !/[?&]retry=1/.test(location.search)) {
    var target = decodeURIComponent(path.slice(prefix.length)) + location.search + location.hash;
    location.replace("/go.html?retry=1&url=" + encodeURIComponent(target));
  } else if (path.indexOf(prefix) === 0) {
    msg.textContent = "The engine couldn't start in this browser. Try Chrome, and make sure the page is on https.";
  } else {
    msg.textContent = "Page not found.";
  }
})();
</script></body></html>
